[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencellcomms"
version = "2.0.0"
description = "Multi-scale cellular simulation platform with gene networks and spatial dynamics"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "OpenCellComms Development Team", email = "opencellcomms@example.com"},
]
maintainers = [
    {name = "OpenCellComms Development Team", email = "opencellcomms@example.com"},
]
keywords = ["cellular simulation", "gene networks", "systems biology", "spatial modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "PyYAML>=6.0",
    "h5py>=3.6.0",
    "tables>=3.7.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "bokeh>=2.4.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.910",
    "pre-commit>=2.20.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.17.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "notebook>=6.4.0",
]
performance = [
    "numba>=0.56.0",
    "cython>=0.29.0",
    "joblib>=1.1.0",
    "dask>=2022.1.0",
]
visualization = [
    "vtk>=9.0.0",
]
# mayavi is a heavy 3D backend (Qt + VTK build) that is painful to install on
# Windows and is not imported anywhere in the codebase. Kept as an opt-in extra
# so the default visualization install stays cross-platform.
mayavi = [
    "mayavi>=4.7.0",
]
diffusion = [
    "fipy>=3.4.0",
]
# Intracellular Boolean engine used by MaBoSS-capable adapters
# (cmaboss is the compiled core and `maboss` is its Python wrapper).
# Kept optional so adapters without this capability stay lightweight.
# cmaboss ships as pre-releases, so the floor allows 1.0.0bN.
maboss = [
    "maboss>=0.8.0",
    "cmaboss>=1.0.0b1",
]
all = [
    "opencellcomms[dev,docs,jupyter,performance,visualization,diffusion,maboss]",
]

[project.scripts]
occ-run = "tools.run_sim:main"

[project.urls]
Homepage = "https://github.com/opencellcomms/opencellcomms"
Documentation = "https://opencellcomms.readthedocs.io/"
Repository = "https://github.com/opencellcomms/opencellcomms.git"
"Bug Tracker" = "https://github.com/opencellcomms/opencellcomms/issues"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "tools", "tools.*", "scripts", "scripts.*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.bnd", "*.txt", "*.md"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["opencellcomms"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    ".tox",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
